services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hisaab
      POSTGRES_PASSWORD: hisaab
      POSTGRES_DB: hisaab
    ports: ["${HISAAB_PG_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisaab -d hisaab"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
