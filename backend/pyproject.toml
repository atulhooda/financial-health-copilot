[project]
name = "hisaab"
version = "0.1.0"
description = "Hisaab: AI Financial Health Copilot backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "polars>=1.5",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "joblib>=1.4",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.50",
    "python-multipart>=0.0.9",
    "scipy>=1.18.1",
]

[project.scripts]
hisaab = "app.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: needs a running PostgreSQL (skipped if unreachable)"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/versions/*" = ["E501", "I001"]
