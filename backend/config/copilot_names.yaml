reasons:
  NEW_DATA_REVEALED: {en: newly linked data showed things we couldn't see before, hi: नए लिंक हुए डेटा से पहले न दिखी बातें
      सामने आईं, hinglish: naye link hue data se pehle na dikhi cheezein saamne aayi}
  ACCOUNT_LINKED: {en: an account was linked, hi: एक खाता लिंक हुआ, hinglish: ek account link hua}
  HIGH_COST_DEBT_FOUND: {en: expensive card debt showed up, hi: महँगा कार्ड कर्ज़ दिखा, hinglish: mehenga card karz dikha}
  DEBT_CLEARED: {en: the card debt was cleared, hi: कार्ड का कर्ज़ चुक गया, hinglish: card ka karz chuk gaya}
  DEBT_GROWING: {en: the card balance kept growing, hi: कार्ड का बकाया बढ़ता रहा, hinglish: card ka bakaya badhta raha}
  INCOME_INCREASED: {en: your income went up, hi: आपकी आय बढ़ी, hinglish: aapki income badhi}
  INCOME_DECREASED: {en: your income went down, hi: आपकी आय घटी, hinglish: aapki income ghati}
  NEW_EMI_ADDED: {en: a new EMI started, hi: एक नई EMI शुरू हुई, hinglish: ek nayi EMI shuru hui}
  EMI_CLOSED: {en: an EMI ended, hi: एक EMI ख़त्म हुई, hinglish: ek EMI khatam hui}
  SUBSCRIPTION_OVERLAP_FOUND: {en: overlapping subscriptions were found, hi: एक जैसे कई सब्सक्रिप्शन मिले, hinglish: ek
      jaise kai subscriptions mile}
  SUBSCRIPTION_CANCELLED: {en: a subscription was cancelled, hi: एक सब्सक्रिप्शन बंद हुआ, hinglish: ek subscription band
      hua}
  SPENDING_DRIFT_UP: {en: some spending rose above your usual month, hi: कुछ खर्च आम महीने से ज़्यादा हुआ, hinglish: kuch
      kharch aam mahine se zyada hua}
  DIP_RISK_UP: {en: the chance of running low rose, hi: बैलेंस कम पड़ने का ख़तरा बढ़ा, hinglish: balance kam padne ka
      khatra badha}
  DIP_RISK_DOWN: {en: the chance of running low fell, hi: बैलेंस कम पड़ने का ख़तरा घटा, hinglish: balance kam padne ka
      khatra ghata}
  BOUNCE_RISK_UP: {en: the risk of an EMI bouncing rose, hi: EMI बाउंस होने का ख़तरा बढ़ा, hinglish: EMI bounce hone ka
      khatra badha}
  BOUNCE_RISK_DOWN: {en: the risk of an EMI bouncing fell, hi: EMI बाउंस होने का ख़तरा घटा, hinglish: EMI bounce hone ka
      khatra ghata}
  SCORE_BAND_CHANGED: {en: your score moved to another band, hi: आपका स्कोर दूसरे बैंड में गया, hinglish: aapka score
      doosre band mein gaya}
  CONFIDENCE_CHANGED: {en: the forecast's confidence changed, hi: अनुमान का भरोसा बदला, hinglish: forecast ka confidence
      badla}

joiners:
  and: {en: " and ", hi: " और ", hinglish: " aur "}
