# Words that mark a payee as a business, not a person (SPEC §5 person detection).
business_words: [STORE, STORES, KIRANA, MEDICAL, MEDICOS, PHARMACY, PHARMA, CHEMIST, CLINIC, HOSPITAL, DIAGNOSTICS,
  ENTERPRISES, ENTERPRISE, TRADERS, TRADING, CAFE, RESTAURANT, HOTEL, DHABA, BAKERY, SWEETS, MART, SUPERMARKET, FUELS,
  PETROL, PETROLEUM, SERVICE, SERVICES, STATION, AGENCY, AGENCIES, CENTRE, CENTER, PVT, LTD, LIMITED, LLP, INDIA,
  TECHNOLOGIES, SOLUTIONS, SYSTEMS, TRAVELS, TOURS, CABS, GARMENTS, FASHION, FOOTWEAR, ELECTRONICS, MOBILE, MOBILES,
  COLLECTION, TEXTILES, ACADEMY, CLASSES, COACHING, SCHOOL, INSTITUTE, INSURANCE, CINEMAS, MULTIPLEX, SALON, PARLOUR,
  GENERAL, PROVISION, DAIRY, VEGETABLES, FRUITS, BHANDAR, CORPORATION, FOODS, KITCHEN, HOUSE, POINT, PLAZA, MALL,
  STUDIO, GYM, FITNESS, LAB, LABS, OPTICALS, JEWELLERS, HARDWARE, PAINTS, SNACKS, BHOJANALAYA, BIRYANI, TEA, CHAI,
  BROADBAND, TELECOM, POWER, GAS, WATER, ELECTRICITY, FILLING, AUTO, MOTORS, GARAGE, WORKS, SHOP, BAZAAR, STALL]

# Noise tokens stripped from payee strings before matching / slugging.
noise_words: [PVT, LTD, LIMITED, PRIVATE, INDIA, ONLINE, PAYMENTS, PAYMENT, UPI, PAY, IN, THE, AND, CO, COM, WWW,
  PUNE, MUMBAI, BENGALURU, BANGALORE, DELHI, NEW, GURUGRAM, NOIDA, HYDERABAD, CHENNAI, KOLKATA, NASHIK]
