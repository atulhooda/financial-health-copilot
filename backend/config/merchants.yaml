# Canonical merchants. aliases: upper-case substrings seen in narrations / VPAs / SMS payees.
# category: for debits.  credit_category: for credits (e.g. a gig platform payout).
# Matching is longest-alias-first so "SWIGGY INSTAMART" beats "SWIGGY".
merchants:
  swiggy:          {name: Swiggy, category: food_delivery, aliases: [SWIGGY, BUNDL TECHNOLOGIES]}
  swiggy_instamart: {name: Swiggy Instamart, category: groceries, aliases: [SWIGGY INSTAMART, INSTAMART]}
  swiggy_partner:  {name: Swiggy (partner payouts), category: other, credit_category: income_gig, aliases: [BUNDL TECH PAYOUT, SWIGGY PARTNER PAYOUT]}
  zomato:          {name: Zomato, category: food_delivery, aliases: [ZOMATO]}
  blinkit:         {name: Blinkit, category: groceries, aliases: [BLINKIT, GROFERS]}
  zepto:           {name: Zepto, category: groceries, aliases: [ZEPTO, KIRANAKART]}
  bigbasket:       {name: BigBasket, category: groceries, aliases: [BIGBASKET, BIG BASKET, SUPERMARKET GROCERY SUPPLIES]}
  dmart:           {name: DMart, category: groceries, aliases: [DMART, AVENUE SUPERMARTS]}
  amazon:          {name: Amazon, category: shopping, aliases: [AMAZON, AMZN, AMAZON PAY]}
