# Guards run before any LLM call (COPILOT.md §8, SPEC D9). Phrases match case-insensitively on whole words after
# normalisation. Tier 1 wins over tier 2; distress wins over scope. Each list has positive and negative tests.

distress_tier1:  # explicit self-harm intent: all advice stops, the LLM is never called
  en: [suicide, suicidal, kill myself, killing myself, end my life, ending my life, take my own life, end it all,
       don't want to live, do not want to live, dont want to live, want to die, better off dead, no reason to live,
       hurt myself, harm myself, self harm, self-harm]
  hinglish: [khudkushi, khudkhushi, khud kushi, aatmahatya, atmahatya, aatmhatya, marna chahta, marna chahti,
             mar jana chahta, mar jana chahti, jeena nahi chahta, jeena nahi chahti, jina nahi chahta,
             jina nahi chahti, zindagi khatam karna, jaan de dunga, jaan de dungi, jaan de doon, khud ko khatam,
             khud ko maar]
  hi: [आत्महत्या, ख़ुदकुशी, खुदकुशी, मरना चाहता, मरना चाहती, मर जाना चाहता, मर जाना चाहती, जीना नहीं चाहता,
