messages:
  distress:
    en: "I'm really sorry you're feeling this way. You don't have to face this alone. Please talk to someone now:
      {helpline} is free, 24x7 and multilingual. Call {numbers}. If you are in immediate danger, call {emergency}.
      The money questions can wait."
    hinglish: "Mujhe bahut afsos hai ki aap aisa mehsoos kar rahe hain. Aap akele nahi hain. Abhi kisi se baat
      kijiye: {helpline} free hai, 24x7 aur kai bhashaon mein. {numbers} par call karein. Agar aap turant khatre mein
      hain, toh {emergency} par call karein. Paison ki baat baad mein ho sakti hai."
    hi: "मुझे बहुत दुख है कि आप ऐसा महसूस कर रहे हैं। आप अकेले नहीं हैं। अभी किसी से बात कीजिए: {helpline} मुफ़्त है,
      24x7 और कई भाषाओं में। {numbers} पर कॉल करें। अगर आप तुरंत ख़तरे में हैं, तो {emergency} पर कॉल करें। पैसों की बात
      बाद में हो सकती है।"
  checkin:
    en: "Money stress like this is heavy. If it ever feels like too much, {helpline} is free and 24x7: {numbers}."
    hinglish: "Paison ka aisa stress bhaari hota hai. Agar kabhi bahut zyada lage, toh {helpline} se baat karein
      (free, 24x7): {numbers}."
    hi: "पैसों का ऐसा तनाव भारी होता है। अगर कभी बहुत ज़्यादा लगे, तो {helpline} से बात करें (मुफ़्त, 24x7): {numbers}।"
  scope:
    en: "I'm not a SEBI-registered investment adviser, so I can't pick stocks, funds or crypto, or promise returns.
      I can help with your own money instead:"
    hinglish: "Main SEBI-registered investment adviser nahi hoon, isliye stocks, funds ya crypto nahi chun sakta, na
      return ka vaada kar sakta hoon. Aapke apne paison mein madad kar sakta hoon:"
    hi: "मैं SEBI-रजिस्टर्ड निवेश सलाहकार नहीं हूँ, इसलिए शेयर, फंड या क्रिप्टो नहीं चुन सकता, न रिटर्न का वादा कर सकता
      हूँ। आपके अपने पैसों में मदद कर सकता हूँ:"
  scope_suggestions:
    en: ["Can I afford a new EMI?", "Where is my money going?", "Will I run short before payday?"]
    hinglish: ["Kya main nayi EMI le sakta hoon?", "Mera paisa kahan ja raha hai?", "Salary se pehle paisa kam padega?"]
    hi: ["क्या मैं नई EMI ले सकता हूँ?", "मेरा पैसा कहाँ जा रहा है?", "क्या सैलरी से पहले पैसे कम पड़ेंगे?"]
  numbers_joiner: {en: " or ", hinglish: " ya ", hi: " या "}
